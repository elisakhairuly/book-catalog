<a
  class="product-card"
  [routerLink]="['/book', book.id]"
  [appHighRating]="book.rating"
>

  <div class="product-image">

    <img
      [src]="book.thumbnail"
      [alt]="book.title"
    >

  </div>


  <div class="product-info">

    <span class="category">
      {{ book.category }}
    </span>

    <h3>
      {{ book.title }}
    </h3>

    <div class="product-bottom">

      <span class="rating">
        <span class="star">★</span>
        {{ book.rating }}
      </span>

      <span class="price">
        ${{ book.price }}
      </span>

    </div>

    <div class="view-details">
      View product
      <span>→</span>
    </div>

  </div>

</a>
