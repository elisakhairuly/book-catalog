<header class="navbar">

  <div class="navbar-inner">

    <!-- =========================
         BRAND
    ========================== -->

    <a
      class="brand"
      routerLink="/home"
    >

      <span class="brand-mark">
        P
      </span>

      <span class="brand-name">
        Product Catalog
      </span>

    </a>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="nav-links">

      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>


      <a
        routerLink="/book"
        routerLinkActive="active"
      >
        Products
      </a>


      <!-- =========================
           CART
      ========================== -->

      <a
        class="cart-link"
        routerLink="/cart"
        routerLinkActive="active"
      >

        <span class="cart-icon">
          🛒
        </span>

        <span>
          Cart
        </span>

        @if (totalItems() > 0) {

          <span class="cart-count">
            {{ totalItems() }}
          </span>

        }

      </a>

    </nav>

  </div>

</header>
