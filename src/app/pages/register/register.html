<div class="auth-page">

  <div class="auth-card">

    <div class="auth-heading">

      <span class="auth-label">
        CREATE ACCOUNT
      </span>

      <h1>
        Daftar Akun
      </h1>

      <p>
        Buat akun untuk melanjutkan
        proses belanja dan checkout.
      </p>

    </div>


    @if (errorMessage) {

      <div class="message error-message">
        {{ errorMessage }}
      </div>

    }


    @if (successMessage) {

      <div class="message success-message">
        {{ successMessage }}
      </div>

    }


    <form
      class="auth-form"
      (ngSubmit)="register()"
    >

      <div class="form-group">

        <label for="name">
          Nama
        </label>

        <input
          id="name"
          type="text"
          name="name"
          placeholder="Masukkan nama"
          [(ngModel)]="name"
          autocomplete="name"
        >

      </div>


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          placeholder="Masukkan email"
          [(ngModel)]="email"
          autocomplete="email"
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          placeholder="Minimal 6 karakter"
          [(ngModel)]="password"
          autocomplete="new-password"
        >

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          Konfirmasi Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          placeholder="Ulangi password"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
        >

      </div>


      <button
        class="auth-button"
        type="submit"
        [disabled]="isSubmitting"
      >

        @if (isSubmitting) {
          Memproses...
        } @else {
          Daftar
        }

      </button>

    </form>


    <div class="auth-footer">

      Sudah punya akun?

      <a routerLink="/login">
        Login
      </a>

    </div>

  </div>

</div>
